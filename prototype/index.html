<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 密室原型 · 消失的第十三幕</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0910; font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  body.hit canvas { cursor: pointer; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; color: #ede3c8;
    font-size: 13px; line-height: 1.9; letter-spacing: .06em;
    background: rgba(8,6,12,.55); border: 1px solid rgba(200,164,77,.28); padding: 10px 14px;
  }
  #hud b { color: #c8a44d; font-weight: 600; }
  #label {
    position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    color: #ede3c8; font-size: 15px; letter-spacing: .1em; padding: 6px 12px;
    background: rgba(8,6,12,.6); border: 1px solid rgba(200,164,77,.28); display: none;
  }
  #dot {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: rgba(237,227,200,.4);
  }
</style>
</head>
<body>
  <div id="hud">
    <b>WASD</b> 移動　<b>滑鼠拖曳</b> 環顧　<b>點擊</b> 互動<br>
    中央金色方塊＝中央自動機　三面牆＝三條支線
  </div>
  <div id="label"></div>
  <div id="dot"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ── 房間尺寸 ────────────────────────────────────────────────
const W = 12, D = 8, H = 3.6;
const EYE = 1.62, RADIUS = 0.34, SPEED = 2.6;

// ── 基礎場景 ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0810);
scene.fog = new THREE.Fog(0x0a0810, 6, 24);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0, EYE, 3.1);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── 燈光 ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x3d3550, 1.0));
scene.add(new THREE.HemisphereLight(0x40384f, 0x1a120e, 0.6));
const pendant = new THREE.PointLight(0xffcf94, 22, 12, 2);
pendant.position.set(0, H - 0.9, -1.2);
pendant.castShadow = true;
scene.add(pendant);
const wash = new THREE.PointLight(0xff6a5a, 5, 9, 2);
wash.position.set(0, 2.4, D / 2 - 1);
scene.add(wash);

// ── 地板、天花板、四面牆 ─────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(W, D),
  new THREE.MeshStandardMaterial({ color: 0x53402c, roughness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(W, D),
  new THREE.MeshStandardMaterial({ color: 0x16121c, roughness: 1 })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = H;
scene.add(ceiling);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x5f554f, roughness: 0.95 });
function wall(w, pos, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, H), wallMat);
  m.position.set(...pos);
  m.rotation.y = rotY;
  m.receiveShadow = true;
  scene.add(m);
}
wall(W, [0, H / 2, -D / 2], 0);              // 北牆：光影畫廊
wall(W, [0, H / 2, D / 2], Math.PI);         // 南牆：終幕牆
wall(D, [-W / 2, H / 2, 0], Math.PI / 2);    // 西牆：機關工作檯
wall(D, [W / 2, H / 2, 0], -Math.PI / 2);    // 東牆：聲音檔案區

// ── 中央自動機（金色方塊）────────────────────────────────────
const automaton = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 1.5, 0.9),
  new THREE.MeshStandardMaterial({
    color: 0xc8a44d, metalness: 0.9, roughness: 0.3,
    emissive: 0x3a2c10, emissiveIntensity: 1
  })
);
automaton.position.set(0, 0.75, -1.2);
automaton.castShadow = true;
automaton.userData.info = { label: '中央自動機', onClick: () => alert('三個徽記槽是空的。') };
scene.add(automaton);

// 碰撞體（XZ 平面的 AABB）
const blockers = [{ minX: -0.75, maxX: 0.75, minZ: -1.95, maxZ: -0.45 }];

// ── 三條支線：三面牆各一個彩色方塊 ───────────────────────────
const branches = [
  { label: '光影畫廊', color: 0xe8c063, pos: [-3.2, 1.5, -D / 2 + 0.3], click: () => alert('這裡是光影線的入口。') },
  { label: '聲音檔案區', color: 0x8fa9c4, pos: [W / 2 - 0.3, 1.4, -0.6], click: () => alert('你觸發了票根電話謎題') },
  { label: '機關工作檯', color: 0xb8794a, pos: [-W / 2 + 0.3, 1.3, 1.4], click: () => alert('這裡是物理線的入口。') }
];

const clickable = [automaton];
for (const b of branches) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.6, 0.6),
    new THREE.MeshStandardMaterial({
      color: b.color, roughness: 0.5, metalness: 0.2,
      emissive: new THREE.Color(b.color).multiplyScalar(0.12), emissiveIntensity: 1
    })
  );
  mesh.position.set(...b.pos);
  mesh.castShadow = true;
  mesh.userData.info = { label: b.label, onClick: b.click };
  mesh.userData.baseEmissive = mesh.material.emissiveIntensity;
  scene.add(mesh);
  clickable.push(mesh);
}
automaton.userData.baseEmissive = automaton.material.emissiveIntensity;

// ── 第一人稱控制：WASD ＋ 滑鼠拖曳 ───────────────────────────
const keys = new Set();
addEventListener('keydown', (e) => keys.add(e.code));
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

let yaw = 0, pitch = 0;
let dragging = false, moved = 0, last = { x: 0, y: 0, t: 0 };
const pointer = new THREE.Vector2(0, 0);
const dom = renderer.domElement;

dom.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  moved = 0;
  last = { x: e.clientX, y: e.clientY, t: performance.now() };
});
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  if (!dragging) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
  if (moved > 3) dom.classList.add('dragging');
  yaw -= dx * 0.0026;
  pitch = Math.max(-1.35, Math.min(1.35, pitch - dy * 0.0026));
  last.x = e.clientX;
  last.y = e.clientY;
});
addEventListener('pointerup', (e) => {
  const wasDrag = moved > 6;
  const quick = performance.now() - last.t < 450;
  dragging = false;
  dom.classList.remove('dragging');
  if (e.button === 0 && !wasDrag && quick) activate();   // 拖曳環顧不會誤觸物件
});
dom.addEventListener('contextmenu', (e) => e.preventDefault());

// ── 點擊偵測（Raycaster）────────────────────────────────────
const raycaster = new THREE.Raycaster();
const labelEl = document.getElementById('label');
let hovered = null;

function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, false);
  return hits.length && hits[0].distance < 4.2 ? hits[0] : null;
}

function activate() {
  const hit = pick();
  if (hit) hit.object.userData.info.onClick();
}

addEventListener('keydown', (e) => { if (e.code === 'KeyE') activate(); });

// ── 移動與碰撞 ──────────────────────────────────────────────
function blocked(x, z) {
  if (x < -W / 2 + RADIUS || x > W / 2 - RADIUS) return true;
  if (z < -D / 2 + RADIUS || z > D / 2 - RADIUS) return true;
  return blockers.some((b) =>
    x > b.minX - RADIUS && x < b.maxX + RADIUS && z > b.minZ - RADIUS && z < b.maxZ + RADIUS);
}

const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  let ax = 0, az = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) az += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) az -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ax -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ax += 1;

  if (ax || az) {
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let vx = fx * az + rx * ax, vz = fz * az + rz * ax;
    const len = Math.hypot(vx, vz) || 1;
    vx = (vx / len) * SPEED * dt;
    vz = (vz / len) * SPEED * dt;
    if (!blocked(camera.position.x + vx, camera.position.z)) camera.position.x += vx;
    if (!blocked(camera.position.x, camera.position.z + vz)) camera.position.z += vz;
  }

  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  automaton.rotation.y += dt * 0.25;

  // hover 高亮＋名稱提示
  const hit = pick();
  const target = hit ? hit.object : null;
  if (target !== hovered) {
    if (hovered) hovered.material.emissiveIntensity = hovered.userData.baseEmissive;
    hovered = target;
  }
  document.body.classList.toggle('hit', !!hovered);
  if (hovered) {
    hovered.material.emissiveIntensity = hovered.userData.baseEmissive + 1.4 + Math.sin(t * 6) * 0.3;
    labelEl.style.display = 'block';
    labelEl.textContent = hovered.userData.info.label;
  } else {
    labelEl.style.display = 'none';
  }

  renderer.render(scene, camera);
}
tick();

window.__proto = { scene, camera, clickable, activate, pick, get hovered() { return hovered; } };
</script>
</body>
</html>
